name: Battle scene v2 smoke fix

on:
  push:
    branches: [chatgpt/battle-scene-v2-20260826]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/battle-scene-v2-20260826
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Finalize battle scene hand tap accessibility
        run: python scripts/patch-browser-smoke-playable-card.py
      - name: Run tests
        run: npm test
      - name: Run mobile browser smoke
        env:
          TRICK_BROWSER_SMOKE: '1'
        run: node --test test/browser-smoke-v1.test.js
      - name: Commit patch
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add battle-scene-v2.js test/battle-scene-v2.test.js test/browser-smoke-v1.test.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: keep mobile hand cards clearly tappable"
          git push origin HEAD:chatgpt/battle-scene-v2-20260826
