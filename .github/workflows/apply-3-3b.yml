name: Apply 3-3B cleanup

on:
  push:
    branches:
      - chatgpt/remove-legacy-tactics-3-3b

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/remove-legacy-tactics-3-3b
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply source cleanup
        run: node scripts/apply-3-3b.js
      - name: Run tests before commit
        run: npm test
      - name: Commit cleanup
        run: |
          rm scripts/apply-3-3b.js .github/workflows/apply-3-3b.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "3-3B: 레거시 전술 시스템 물리적 제거"
          git push origin HEAD:chatgpt/remove-legacy-tactics-3-3b
