name: Browser smoke self patch

on:
  push:
    branches: [chatgpt/browser-smoke-test-20260826]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/browser-smoke-test-20260826
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch scroll-aware clicking
        run: python scripts/browser-smoke-scroll-patch.py
      - name: Run browser smoke
        env:
          TRICK_BROWSER_SMOKE: '1'
        run: node --test test/browser-smoke-v1.test.js
      - name: Commit patch
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add test/browser-smoke-v1.test.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "test: scroll mobile targets into view before CDP clicks"
          git push origin HEAD:chatgpt/browser-smoke-test-20260826
