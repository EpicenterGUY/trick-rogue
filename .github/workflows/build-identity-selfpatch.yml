name: Build identity self patch

on:
  push:
    branches: [chatgpt/build-identity-overhaul-20260826]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/build-identity-overhaul-20260826
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Repair selfpatch target
        shell: bash
        run: |
          set -o pipefail
          python scripts/fix-selfpatch-trait.py 2>&1 | tee repair-output.txt
      - name: Apply build identity overhaul
        shell: bash
        run: |
          set -o pipefail
          python scripts/build-identity-selfpatch.py 2>&1 | tee selfpatch-output.txt
          python scripts/build-identity-postpatch.py 2>&1 | tee postpatch-output.txt
          node -e "console.log('field keys',Object.keys(require('./encounter-rules.js').FIELD_DEFINITIONS))" | tee field-debug.txt
      - name: Run tests
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.txt
      - name: Run mobile browser smoke
        shell: bash
        env:
          TRICK_BROWSER_SMOKE: '1'
        run: |
          set -o pipefail
          node --test test/browser-smoke-v1.test.js 2>&1 | tee browser-output.txt
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-identity-diagnostics
          path: |
            repair-output.txt
            selfpatch-output.txt
            postpatch-output.txt
            field-debug.txt
            test-output.txt
            browser-output.txt
            run-start-v2.js
            encounter-rules.js
            run-fields.js
            compendium-8-h.js
            compendium-8-h-runtime-bridge.js
          if-no-files-found: ignore
      - name: Commit patch
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add run-start-v2.js effects.js cards.js card-text-mode.js encounter-rules.js run-fields.js compendium-8-h.js compendium-8-h-runtime-bridge.js test/run-start-v2.test.js test/effect-card-catalog.test.js test/encounter-rules.test.js test/compendium-complete.test.js test/browser-smoke-v1.test.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: overhaul starter traits fields and build tags"
          git push origin HEAD:chatgpt/build-identity-overhaul-20260826
