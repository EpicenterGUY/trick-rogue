name: Run V3 rebase self patch

on:
  push:
    branches: [chatgpt/run-v3-rebase-20260826]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/run-v3-rebase-20260826
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply latest-main compatibility patch
        run: python scripts/run-v3-rebase-patch.py
      - name: Run full tests
        run: npm test
      - name: Run mobile browser smoke
        env:
          TRICK_BROWSER_SMOKE: '1'
        run: node --test test/browser-smoke-v1.test.js
      - name: Commit patch
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add enemy-behavior.js run-flow-v2.js test/browser-smoke-v1.test.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: 최신 런타임 체인에 Run V3 연결"
          git push origin HEAD:chatgpt/run-v3-rebase-20260826
