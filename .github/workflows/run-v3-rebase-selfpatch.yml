name: Run V3 rebase self patch

on:
  push:
    branches: [chatgpt/run-v3-rebase-20260826]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/run-v3-rebase-20260826
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply latest-main compatibility patch
        run: python scripts/run-v3-rebase-patch.py
      - name: Run full tests and capture output
        shell: bash
        run: |
          set +e
          npm test 2>&1 | tee test-output.txt
          TEST_EXIT=${PIPESTATUS[0]}
          echo "TEST_EXIT=$TEST_EXIT" >> "$GITHUB_ENV"
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: run-v3-test-output
          path: test-output.txt
          if-no-files-found: error
      - name: Fail if tests failed
        shell: bash
        run: exit "$TEST_EXIT"
      - name: Run mobile browser smoke
        env:
          TRICK_BROWSER_SMOKE: '1'
        run: node --test test/browser-smoke-v1.test.js
      - name: Commit patch
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add enemy-behavior.js run-flow-v2.js test/browser-smoke-v1.test.js test/deck-boundaries-7-5j.test.js test/run-economy-v2.test.js test/run-start-v2.test.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: 최신 런타임 체인에 Run V3 연결"
          git push origin HEAD:chatgpt/run-v3-rebase-20260826
