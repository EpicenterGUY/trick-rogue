name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  m5-telemetry:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test --test-concurrency=1 test/run-balance-telemetry.test.js

  tests-ae:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run A-E tests
        run: |
          mapfile -t files < <(find test -maxdepth 1 -name '*.test.js' ! -name 'run-balance-telemetry.test.js' | sort | grep -E '/[a-e][^/]*\.test\.js$')
          node --test --test-concurrency=1 "${files[@]}"

  tests-fm:
    name: fm-${{ matrix.test }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        test:
          - fold-experiment-8-e.test.js
          - game-like-battle-ui.test.js
          - game-ui-v1.test.js
          - keyword-action-button-browser.test.js
          - keyword-action-button-guard.test.js
          - latest-rules-regression-7-5r.test.js
          - legacy-content-cleanup-7-5p.test.js
          - lost-and-found-p0.test.js
          - m4-weird-cards-batch2.test.js
          - m4-weird-cards-batch3.test.js
          - m4-weird-cards-batch4.test.js
          - migrated-tactic-cards.test.js
          - mobile-battle-hud-m3.test.js
          - mobile-map-layout-m3.test.js
          - mobile-ui-cleanup.test.js
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test --test-concurrency=1 test/${{ matrix.test }}

  tests-nr:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run N-R tests
        run: |
          mapfile -t files < <(find test -maxdepth 1 -name '*.test.js' ! -name 'run-balance-telemetry.test.js' | sort | grep -E '/[n-r][^/]*\.test\.js$')
          node --test --test-concurrency=1 "${files[@]}"

  tests-sz:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run S-Z tests
        run: |
          mapfile -t files < <(find test -maxdepth 1 -name '*.test.js' ! -name 'run-balance-telemetry.test.js' | sort | grep -E '/[s-z][^/]*\.test\.js$')
          node --test --test-concurrency=1 "${files[@]}"

  validate-cards:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run validate:cards
