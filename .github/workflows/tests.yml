name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  batch1:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test test/effect-card-70-batch1.test.js
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test test/effect-card-catalog.test.js
  remaining:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test $(find test -maxdepth 1 -name '*.test.js' ! -name 'effect-card-70-batch1.test.js' ! -name 'effect-card-catalog.test.js' -print)
