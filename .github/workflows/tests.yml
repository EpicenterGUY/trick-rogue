name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/fix-start-freeze-and-flash-20260826
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply startup hotfix
        run: python scripts/startup-hotfix-patch.py
      - run: npm test
      - name: Commit patched files
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add game-ui.js index.html test/game-ui-v1.test.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: prevent startup UI freeze and legacy flash"
          git push origin HEAD:chatgpt/fix-start-freeze-and-flash-20260826
