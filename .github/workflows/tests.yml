name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  m5-telemetry:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test --test-concurrency=1 test/run-balance-telemetry.test.js

  tests-ae:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run A-E tests
        run: |
          mapfile -t files < <(find test -maxdepth 1 -name '*.test.js' ! -name 'run-balance-telemetry.test.js' | sort | grep -E '/[a-e][^/]*\.test\.js$')
          node --test --test-concurrency=1 "${files[@]}"

  tests-fm:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run F-M tests
        run: |
          mapfile -t files < <(find test -maxdepth 1 -name '*.test.js' ! -name 'run-balance-telemetry.test.js' | sort | grep -E '/[f-m][^/]*\.test\.js$')
          node --test --test-concurrency=1 "${files[@]}"

  tests-nr:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run N-R tests
        run: |
          mapfile -t files < <(find test -maxdepth 1 -name '*.test.js' ! -name 'run-balance-telemetry.test.js' | sort | grep -E '/[n-r][^/]*\.test\.js$')
          node --test --test-concurrency=1 "${files[@]}"

  tests-sz:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run S-Z tests
        run: |
          mapfile -t files < <(find test -maxdepth 1 -name '*.test.js' ! -name 'run-balance-telemetry.test.js' | sort | grep -E '/[s-z][^/]*\.test\.js$')
          node --test --test-concurrency=1 "${files[@]}"

  validate-cards:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run validate:cards
