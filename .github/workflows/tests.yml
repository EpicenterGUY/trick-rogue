name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  m8-field-ux:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test --test-concurrency=1 test/run-field-ux.test.js

  existing-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          mapfile -t files < <(find test -maxdepth 1 -name '*.test.js' ! -name 'run-field-ux.test.js' | sort)
          node --test --test-concurrency=1 "${files[@]}"
      - run: npm run validate:cards
