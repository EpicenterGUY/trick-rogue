name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  batch1:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test test/effect-card-70-batch1.test.js
  remaining-t:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test $(find test -maxdepth 1 -name 't*.test.js' -print)
  remaining-u-z:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test $(find test -maxdepth 1 -name '[u-z]*.test.js' -print)
