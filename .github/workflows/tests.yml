name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ios-timing:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run iOS timing regression
        run: node --test test/ios-trick-timing.test.js

  remaining:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run remaining Node tests
        run: |
          mapfile -t files < <(find test -maxdepth 1 -name '*.test.js' ! -name 'ios-trick-timing.test.js' | sort)
          node --test "${files[@]}"
      - name: Validate cards
        run: npm run validate:cards
