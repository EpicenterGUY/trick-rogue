name: Runtime bugfix self patch

on:
  push:
    branches: [chatgpt/runtime-bugfix-pass-20260826]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/runtime-bugfix-pass-20260826
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply runtime bugfixes
        run: python scripts/runtime-bugfix-patch.py
      - name: Run full tests
        run: npm test
      - name: Commit bugfixes
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html game-ui.js test/runtime-bugfixes-v1.test.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: make forecast read-only and battle piles accurate"
          git push origin HEAD:chatgpt/runtime-bugfix-pass-20260826
