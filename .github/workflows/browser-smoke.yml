name: Browser Smoke

on:
  push:
    branches: [main]
  pull_request:

jobs:
  mobile-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Chrome
        run: google-chrome --version || google-chrome-stable --version || chromium --version
      - name: Run mobile browser smoke
        env:
          TRICK_BROWSER_SMOKE: '1'
          TRICK_FIELD_UX_BROWSER: '1'
        run: node --test --test-concurrency=1 test/browser-smoke-v1.test.js test/keyword-action-button-browser.test.js test/run-field-ux-browser.test.js
      - name: Run RUN V3 browser E2E
        env:
          TRICK_RUN_V3_E2E: '1'
        run: node --test --test-concurrency=1 test/run-v3-browser-e2e-v2.test.js test/casino-region-m9-browser-load.test.js test/casino-region-m9-full-run-browser.test.js test/red-ward-region-m9-browser.test.js
