<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>TRICK//ROGUE - Pixel Rework v2</title>
<meta name="theme-color" content="#11131b">
<style>
:root{
  --bg:#0e1118;--bg2:#0a0c12;--panel:#1b2130;--panel2:#232a3d;--line:#425072;
  --text:#f2ead8;--soft:#9ba7c2;--gold:#e4bd62;--cyan:#67d3d0;--red:#ef6575;--green:#78d68b;--violet:#9e89f2;
  --paper:#efe5cc;--paper2:#dfcfb0;--ink:#252933;--shadow:#0008;--px:2px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090b10;color:var(--text);font-family:"Courier New",monospace}
button{font:inherit;color:inherit}
#app{
  position:relative;margin:auto;width:min(100vw,460px);height:100dvh;overflow:hidden;
  background:
    linear-gradient(180deg,#141924,#090b10 68%),
    repeating-linear-gradient(0deg,transparent 0 3px,#ffffff03 3px 4px),
    repeating-linear-gradient(90deg,transparent 0 3px,#ffffff03 3px 4px);
  image-rendering:pixelated;
}
#app:before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 18% 0%,#1e5f64aa 0,transparent 30%),radial-gradient(circle at 88% 10%,#6e3244aa 0,transparent 26%);opacity:.85}
.screen{position:absolute;inset:0;display:none;flex-direction:column;z-index:2}
.screen.active{display:flex;animation:fade .22s cubic-bezier(.2,.75,.25,1)}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.pixel{border:var(--px) solid #000;background:var(--panel);box-shadow:0 0 0 var(--px) var(--line) inset, 0 var(--px) 0 #fff1 inset, calc(var(--px)*2) calc(var(--px)*2) 0 #0006}
.pixelBtn{border:var(--px) solid #000;background:linear-gradient(180deg,#2d3850,#1a2230);box-shadow:0 0 0 var(--px) #50607e inset,calc(var(--px)*2) calc(var(--px)*2) 0 #0006;padding:8px 10px;color:var(--text)}
.pixelBtn.primary{background:linear-gradient(180deg,#2b676b,#1b3b40);box-shadow:0 0 0 var(--px) #63a2a6 inset,calc(var(--px)*2) calc(var(--px)*2) 0 #0006}
.pixelBtn.gold{background:linear-gradient(180deg,#6f5828,#43361c);box-shadow:0 0 0 var(--px) #aa8a49 inset,calc(var(--px)*2) calc(var(--px)*2) 0 #0006}
.pixelBtn{transition:transform .16s cubic-bezier(.2,.8,.2,1), filter .16s ease, box-shadow .16s ease} .pixelBtn:hover{filter:brightness(1.08)} .pixelBtn:active{transform:translate(var(--px),var(--px));box-shadow:0 0 0 var(--px) #50607e inset}
.row{display:flex;gap:8px}.between{display:flex;justify-content:space-between;align-items:center;gap:8px}
.topbar{padding:10px 10px 6px}.logo{font-weight:900;font-size:20px;letter-spacing:-1px}.logo b{color:var(--cyan)}.sub{font-size:11px;color:var(--soft)}
.badge{display:inline-flex;align-items:center;gap:5px;padding:4px 7px;border:var(--px) solid #000;background:#10151f;box-shadow:0 0 0 var(--px) #2e3850 inset;font-size:11px}
.small{font-size:11px;color:var(--soft)} .tiny{font-size:10px;color:var(--soft)}
.red{color:var(--red)} .cyan{color:var(--cyan)} .gold{color:var(--gold)} .green{color:var(--green)} .violet{color:var(--violet)}
.scrollX{overflow-x:auto;overflow-y:hidden;scrollbar-width:none}.scrollX::-webkit-scrollbar{display:none}
.scrollY{overflow-y:auto;scrollbar-width:none}.scrollY::-webkit-scrollbar{display:none}
.section{padding:0 10px 10px}
.sectionTitle{font-size:13px;font-weight:700;color:#f4d98f;margin:8px 0 6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
/* start */
#startScreen .hero{margin:10px;padding:12px 12px 10px;position:relative;overflow:hidden;min-height:132px}
.hero h1{margin:0;font-size:28px;line-height:.95;letter-spacing:-2px}.hero p{margin:8px 0 0;max-width:65%;font-size:11px;line-height:1.45;color:#bdc7da}
.heroSprite{position:absolute;right:10px;bottom:6px;width:120px;height:120px}
.option{padding:8px;cursor:pointer;min-height:104px;background:linear-gradient(180deg,#243049,#1a2232)}
.option.sel{box-shadow:0 0 0 var(--px) var(--cyan) inset,calc(var(--px)*2) calc(var(--px)*2) 0 #0006;background:linear-gradient(180deg,#2c4451,#1b2c31)}
.option h3{margin:4px 0 3px;font-size:12px}.option p{margin:0;font-size:10px;line-height:1.35;color:#b6c1d5}.optionSprite{height:40px;display:grid;place-items:center}
.startBottom{padding:0 10px 14px;margin-top:auto}
/* map */
#mapScreen{padding-bottom:8px}
#mapWrap{margin:8px 10px 0;padding:10px;height:58%;position:relative;overflow:hidden}
#mapSvg{position:absolute;inset:0;pointer-events:none}
#mapGrid{position:relative;height:100%}
.node{position:absolute;width:72px;height:54px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:2px;border:var(--px) solid #000;background:linear-gradient(180deg,#2a3346,#1c2230);box-shadow:0 0 0 var(--px) #495a7a inset,calc(var(--px)*2) calc(var(--px)*2) 0 #0006;cursor:pointer}
.node{transition:transform .2s cubic-bezier(.2,.8,.2,1), filter .2s ease} .node:hover{transform:translateY(-2px)} .node.lock{opacity:.28;filter:grayscale(1);pointer-events:none}.node.done{opacity:.4}.node.current{box-shadow:0 0 0 var(--px) var(--cyan) inset,0 0 0 calc(var(--px)*2) #000,calc(var(--px)*2) calc(var(--px)*2) 0 #0006;animation:nodePulse 1.3s ease-in-out infinite}
.node .icon{font-size:18px}.node .nm{font-size:11px}
#mapDeckStrip{margin:10px;padding:8px;display:flex;gap:8px;overflow-x:auto;align-items:flex-start}
.miniCard{min-width:62px;width:62px;height:92px;padding:0;border:none;background:transparent;color:var(--ink);box-shadow:none;display:block;overflow:visible}
.miniCard .cardArt{height:100%;margin:0}.miniCard svg,.miniCard img{width:100%;height:100%;display:block;image-rendering:pixelated;filter:drop-shadow(0 3px 0 #0007)}
.poolWrap{display:flex;flex-direction:column;gap:10px}.poolHead{display:flex;justify-content:space-between;gap:8px;align-items:end;flex-wrap:wrap}.poolTabs{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.poolTabs .pixelBtn{padding:5px 8px;font-size:11px}.poolBody{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}.poolGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(95px,1fr));gap:10px;align-content:start}.poolCardBtn{padding:0;border:0;background:none;cursor:pointer;text-align:left}.poolCard{background:#141c2a;border:var(--px) solid #000;box-shadow:0 0 0 var(--px) #44567a inset;padding:6px;transition:transform .12s ease,filter .12s ease,box-shadow .12s ease}.poolCardBtn:hover .poolCard,.poolCardBtn.sel .poolCard{transform:translateY(-3px);filter:brightness(1.03);box-shadow:0 0 0 var(--px) #81a1d2 inset,0 0 0 calc(var(--px)*2) #000}.poolCard .cardArt{height:150px;margin:0}.poolCard .cardArt svg,.poolCard .cardArt img{width:100%;height:100%;display:block;image-rendering:pixelated;filter:drop-shadow(0 4px 0 #0004)}.poolDetail{background:#121a27;border:var(--px) solid #000;box-shadow:0 0 0 var(--px) #41516d inset;padding:10px;display:grid;grid-template-columns:90px 1fr;gap:10px;align-items:start}.poolDetailArt{height:132px}.poolDetailArt svg,.poolDetailArt img{width:100%;height:100%;display:block}.poolDetailTitle{font-size:13px;font-weight:800}.poolDetailText{font-size:10px;line-height:1.5;color:#d0d8e7;margin-top:5px}.poolDetailMeta{font-size:9px;line-height:1.45;color:#97abc6;margin-top:7px}.poolDeckBar{font-size:11px;color:#b7c7de}.poolCount{color:#8ed8e1}.missingArt{width:100%;height:100%;display:grid;place-items:center;text-align:center;background:#efe5cf;color:#6e5d49;border:2px solid #d39a27;font-size:10px}@media(min-width:560px){.poolBody{grid-template-columns:minmax(0,1fr) 220px;align-items:start}.poolDetail{position:sticky;top:0}}
/* battle */
#battleScreen{padding-bottom:6px;overflow-y:auto}
#battleMain{display:flex;flex-direction:column;gap:6px;padding:0 8px 8px;min-height:0;flex:none}
#statusTop{display:grid;grid-template-columns:1fr auto 1fr;gap:6px}
.hpPanel{padding:8px}.hpHead{display:flex;justify-content:space-between;font-size:11px;font-weight:700}.hpBar{height:10px;margin-top:5px;border:var(--px) solid #000;background:#0e1218;box-shadow:0 0 0 var(--px) #2a354a inset}.hpFill{height:100%}#pHpFill{background:#4ed0d0}#eHpFill{background:#e25a6a}
.midStat{padding:10px 8px;min-width:62px;text-align:center;font-size:11px}.midStat b{display:block;font-size:16px;color:var(--gold)}
#arena{padding:8px;display:flex;flex-direction:column;gap:6px;min-height:418px;flex:none;position:relative;overflow:visible;background:linear-gradient(180deg,#1a2233,#111827)}
#arena:before{content:"";position:absolute;left:0;right:0;bottom:0;height:44%;background:repeating-linear-gradient(90deg,#0000 0 10px,#0003 10px 12px),linear-gradient(180deg,#0e1420,#0b1017);clip-path:polygon(0 100%,0 58%,7% 58%,7% 35%,12% 35%,12% 56%,18% 56%,18% 20%,24% 20%,24% 44%,31% 44%,31% 62%,37% 62%,37% 33%,44% 33%,44% 50%,51% 50%,51% 17%,58% 17%,58% 55%,66% 55%,66% 27%,73% 27%,73% 59%,79% 59%,79% 40%,86% 40%,86% 65%,93% 65%,93% 52%,100% 52%,100% 100%);opacity:.45} #arena:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(180deg,#ffffff03 0 2px,#0000 2px 4px);pointer-events:none;mix-blend-mode:screen;opacity:.28}
.intentWrap{display:grid;grid-template-columns:70px 1fr;gap:6px;position:relative;z-index:2}
.portrait{width:70px;height:70px;border:var(--px) solid #000;background:linear-gradient(180deg,#23304a,#171d2a);box-shadow:0 0 0 var(--px) #4c5e7f inset,0 0 12px #0006;display:grid;place-items:center;overflow:hidden}
.intentBox{padding:8px}.intentTitle{font-size:11px;color:#ffb5bc}.intentMain{font-size:14px;font-weight:700;margin-top:3px}.intentSub{font-size:10px;color:var(--soft);margin-top:3px;line-height:1.3}
.arenaMeta{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;position:relative;z-index:2}
.forecastRow{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;position:relative;z-index:2}
#versus{display:grid;grid-template-columns:1fr 28px 1fr;align-items:center;gap:6px;position:relative;z-index:2;min-height:150px}
.stageCard{height:138px;min-height:138px;display:none;position:relative;overflow:visible;background:transparent;border:none;box-shadow:none;padding:0;justify-self:center;align-self:center}.stageCard.show{display:grid;place-items:center;animation:cardPop .24s cubic-bezier(.18,.8,.2,1)}.stageInner{position:relative;width:92px;height:136px;filter:drop-shadow(0 6px 0 #0008)}.stageInner svg,.stageInner img{width:100%;height:100%;display:block;image-rendering:pixelated}.stageLabel{position:absolute;left:50%;top:-8px;transform:translateX(-50%);font-size:9px;padding:2px 6px;border:var(--px) solid #000;background:#152032;box-shadow:0 0 0 var(--px) #3b4f72 inset;color:#dce6f8;white-space:nowrap}.vsText{text-align:center;font-size:18px;font-weight:800;color:#c7d0e3}
#slotRow{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;position:relative;z-index:2}
.slot{height:94px;border:var(--px) dashed #384660;background:#091018;display:grid;place-items:center;font-size:10px;color:#7f8ca5;transition:transform .16s cubic-bezier(.2,.8,.2,1),filter .16s ease;overflow:hidden}.slot.fill{border-style:solid;background:#0f1622;color:var(--ink);box-shadow:0 0 0 var(--px) #445267 inset;cursor:pointer;padding:3px}.slot.fill:active{transform:translateY(1px)}.slot.fill:hover{filter:brightness(1.08)}.slot.inspecting{outline:2px solid var(--cyan);transform:translateY(-2px)}.slot small{display:block;font-size:9px}.slotArt{width:56px;height:82px;margin:0 auto 2px}.slotArt img,.slotArt svg{width:100%;height:100%;display:block;image-rendering:pixelated;filter:drop-shadow(0 2px 0 #0007)}
#statuses{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;position:relative;z-index:2}
.stateChip{padding:4px 6px;border:var(--px) solid #000;background:#111824;box-shadow:0 0 0 var(--px) #31405a inset;font-size:10px}
#inspect{padding:8px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;min-height:84px;max-height:124px;overflow:hidden;transition:max-height .18s ease, min-height .18s ease, padding .18s ease} #inspect.collapsed{min-height:56px;max-height:56px} #inspect.collapsed #inspectApply,#inspect.collapsed #systemLegend,#inspect.collapsed #termRow{display:none} #inspect.collapsed #inspectDesc{max-height:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#inspect>div{min-width:0;max-height:108px;overflow-y:auto;padding-right:4px;scrollbar-width:thin}
#inspectTitle{font-size:12px;font-weight:700;position:sticky;top:0;background:#1b2130;padding-bottom:3px;z-index:1}#inspectDesc{margin-top:3px;font-size:10px;line-height:1.45;color:#c4cede;white-space:normal;overflow:visible}#inspectApply{margin-top:5px;font-size:10px;line-height:1.35;color:#ecdcbc}.inspectHint{color:#8fa6c9}#termRow{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px;padding-bottom:2px}.termBtn{padding:3px 5px;border:var(--px) solid #000;background:#0f1621;box-shadow:0 0 0 var(--px) #2f3b53 inset;font-size:9px}
#playBtn{padding:10px 12px;min-width:76px;align-self:center;position:sticky;right:0}
.panelTitle{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px;color:#b4bfd2;font-size:11px}
#handPanel,#tacticPanel{padding:8px;overflow:visible}
#handRow,#tacticRow{display:flex;gap:6px;overflow-x:auto;overflow-y:visible;align-items:flex-start;padding:4px 2px 10px}
.card{min-width:100px;width:100px;height:148px;padding:0;border:none;background:transparent;box-shadow:none;color:var(--ink);position:relative;cursor:pointer;transition:transform .18s cubic-bezier(.2,.8,.2,1), filter .18s ease;animation:handIn .24s cubic-bezier(.2,.8,.2,1);overflow:visible;flex:0 0 auto}.card:hover{transform:translateY(-4px);filter:brightness(1.05)} .card:after{display:none}
.card.named{filter:drop-shadow(0 5px 0 #0006)}.card.sel{transform:translateY(-6px) scale(1.02);filter:drop-shadow(0 0 0 #000) drop-shadow(0 0 10px #63d3d599)}
.cardTop,.cardName,.cardDesc,.cardTag{display:none}.cardSuit{font-size:17px}.cardArt{height:100%;margin:0;border:none;background:transparent;display:grid;place-items:center;overflow:visible;position:relative}.cardArt:after{display:none}.cardArt svg,.cardArt img{width:100%;height:100%;display:block;filter:drop-shadow(0 4px 0 #0006)}
.tactic{min-width:86px;width:86px;height:132px;padding:0;border:none;background:transparent;color:var(--ink);cursor:pointer;position:relative;transition:transform .18s cubic-bezier(.2,.8,.2,1), filter .18s ease;animation:handIn .24s cubic-bezier(.2,.8,.2,1);overflow:visible;flex:0 0 auto}.tactic:hover{transform:translateY(-3px);filter:brightness(1.05)} .tactic.off{opacity:.45}.tactic.sel{transform:translateY(-4px)}
.tacticArt{height:100%}.tacticArt img,.tacticArt svg{width:100%;height:100%;display:block;filter:drop-shadow(0 4px 0 #0006)}
/* modal */
#overlay{position:absolute;inset:0;background:#06080ecc;display:none;align-items:center;justify-content:center;padding:10px;z-index:20}
#overlay.show{display:flex}.modal{width:100%;max-height:92dvh;padding:10px;overflow:auto;border:var(--px) solid #000;background:linear-gradient(180deg,#232b3f,#171e2d);box-shadow:0 0 0 var(--px) #556789 inset,calc(var(--px)*2) calc(var(--px)*2) 0 #0006;animation:modalPop .2s cubic-bezier(.2,.8,.2,1)}
.modal h2{margin:0 0 6px;font-size:18px}.modal p{font-size:11px;line-height:1.45;color:#c5cedd}.choiceList{display:grid;gap:6px;margin-top:8px}.choice{width:100%;padding:8px;text-align:left;border:var(--px) solid #000;background:linear-gradient(180deg,#2a3550,#1a2232);box-shadow:0 0 0 var(--px) #51617f inset;color:var(--text)}.choice b{font-size:12px}.choice span{display:block;font-size:10px;color:#cad2e0;line-height:1.3;margin-top:3px}
.rewardGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}.rewardBox{padding:5px;border:var(--px) solid #000;background:linear-gradient(180deg,var(--paper),var(--paper2));box-shadow:0 0 0 var(--px) #b6a88a inset,0 0 12px #0002;color:var(--ink);transition:transform .14s steps(3), filter .14s steps(3)} .rewardBox:hover{transform:translateY(-2px);filter:brightness(1.04)}.rewardBox h3{margin:4px 0 2px;font-size:10px;line-height:1.15}.rewardBox p{font-size:8px;line-height:1.25;color:#565b66;min-height:54px}.rewardBtns{display:grid;gap:4px}.rewardBtns button{padding:5px 4px;border:1px solid #8d816d;background:#e8dcc3;color:#262a33;font-size:8px}
.flyingCard{position:absolute;z-index:50;pointer-events:none;transform-origin:center;transition:left .34s cubic-bezier(.18,.82,.2,1),top .34s cubic-bezier(.18,.82,.2,1),width .34s cubic-bezier(.18,.82,.2,1),height .34s cubic-bezier(.18,.82,.2,1),transform .34s cubic-bezier(.18,.82,.2,1),opacity .28s ease;filter:drop-shadow(0 10px 10px #0008)}
.float{position:absolute;z-index:15;font-size:16px;font-weight:800;pointer-events:none;animation:float .72s cubic-bezier(.2,.7,.25,1) forwards;text-shadow:2px 2px 0 #000}.flash{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:22px;z-index:16;font-weight:900;text-shadow:3px 3px 0 #000;animation:flash .78s cubic-bezier(.18,.82,.2,1) forwards;text-align:center}.particle{position:absolute;width:8px;height:8px;z-index:14;pointer-events:none;animation:burst .56s cubic-bezier(.2,.7,.25,1) forwards}.slash{position:absolute;left:50%;top:46%;width:120px;height:14px;background:linear-gradient(90deg,#fff,#ffeb92,#fff0);transform:translate(-50%,-50%) rotate(-16deg);box-shadow:0 0 12px #fff8;z-index:15;animation:slash .25s cubic-bezier(.15,.75,.15,1) forwards;pointer-events:none}
@keyframes float{0%{opacity:0;transform:translate(-50%,8px)}20%{opacity:1}100%{opacity:0;transform:translate(-50%,-30px)}}@keyframes flash{0%{opacity:0;transform:translate(-50%,-50%) scale(.8)}15%{opacity:1}100%{opacity:0;transform:translate(-50%,-62%) scale(1)}}@keyframes nodePulse{0%{filter:brightness(1)}50%{filter:brightness(1.18)}100%{filter:brightness(1)}}@keyframes cardPop{0%{opacity:0;transform:scale(.86) translateY(8px)}100%{opacity:1;transform:scale(1) translateY(0)}}@keyframes handIn{0%{opacity:0;transform:translateY(8px)}100%{opacity:1;transform:translateY(0)}}@keyframes modalPop{0%{opacity:0;transform:scale(.92)}100%{opacity:1;transform:scale(1)}}@keyframes burst{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.2)}}@keyframes slash{0%{opacity:0;transform:translate(-50%,-50%) rotate(-18deg) scaleX(.4)}100%{opacity:0;transform:translate(-50%,-50%) rotate(-18deg) scaleX(1.1)}}
.shake{animation:shake .28s ease-out}@keyframes shake{25%{transform:translateX(3px)}50%{transform:translateX(-3px)}75%{transform:translateX(2px)}}
@media (max-height:820px){
  .hero h1{font-size:25px}.hero p{max-width:60%}.option{min-height:96px}.portrait{width:60px;height:60px}.intentWrap{grid-template-columns:60px 1fr}.stageCard{height:128px}.card{min-width:86px;width:86px;height:132px}.cardArt{height:100%}.tactic{min-width:88px;width:88px}.node{width:66px;height:50px}
}

/* v25 — icon-first card system */
.card.named{filter:drop-shadow(0 3px 0 #0007)}
.card.sel{transform:translateY(-7px) scale(1.025);filter:drop-shadow(0 0 8px #68d1d788)}
.cardArt svg,.tacticArt svg,.slotArt svg,.stageCard svg,.poolCard .cardArt svg,.miniCard svg{shape-rendering:geometricPrecision;filter:drop-shadow(0 3px 0 #0005)}
.tacticArt svg{filter:drop-shadow(0 3px 0 #0006)}
.poolCard{background:#161d2a;border:2px solid #080b10;box-shadow:0 0 0 2px #344158 inset;padding:7px;border-radius:5px}
.poolCard b{font-size:11px}.poolCard span{color:#c6cfdd}

</style>
</head>
<body>
<div id="app">
  <section class="screen active" id="startScreen">
    <div class="hero pixel">
      <h1>TRICK<b>//</b>ROGUE</h1>
      <p>트릭으로 우세를 쌓고, 5장의 쇼다운으로 피해를 만든다. 평범한 트럼프를 네임드 카드로 개조해 빌드를 만든다.</p>
      <div class="heroSprite" id="heroSprite"></div>
    </div>
    <div class="section">
      <div class="sectionTitle">캐릭터</div>
      <div class="grid2" id="charGrid"></div>
      <div class="sectionTitle">스타팅 패키지</div>
      <div class="grid2" id="packGrid"></div>
    </div>
    <div class="startBottom"><button class="pixelBtn primary" style="width:100%;padding:11px" onclick="beginRun()">런 시작</button></div>
  </section>

  <section class="screen" id="mapScreen">
    <div class="topbar between">
      <div><div class="logo">ACT 1 · <b>잔광 구역</b></div><div class="sub">노드를 선택해 덱을 개조하자</div></div>
      <button class="pixelBtn" onclick="showDeck()">덱 보기</button><button class="pixelBtn" onclick="showPool()">카드풀</button><button class="pixelBtn" onclick="showNewPack()">신규 1팩</button>
    </div>

function parseEffectSections(desc=''){
  const keys=['발동','조건','효과','추가'];
  const map={};
  let remaining=desc;
  keys.forEach((k,idx)=>{
    const token=k+':';
    const start=remaining.indexOf(token);
    if(start!==-1){
      let nextPos=remaining.length;
      keys.forEach(k2=>{ if(k2===k) return; const p=remaining.indexOf(k2+':', start+token.length); if(p!==-1 && p<nextPos) nextPos=p; });
      map[k]=remaining.slice(start+token.length,nextPos).trim();
    }
  });
  return map;
}
function formatEffectText(desc=''){
  const parts=parseEffectSections(desc), order=['발동','조건','효과','추가'];
  const items=order.filter(k=>parts[k]).map(k=>`<div><span class="legendChip" onclick="showSystemNote('${k}')">${k}</span> ${parts[k]}</div>`);
  return items.length?items.join(''):desc;
}

  const parts=parseEffectSections(desc), order=['발동','조건','효과','추가'];

 }} }

async function playSelected(){ const c=battle.hand.find(x=>x.uid===battle.selected); if(!c)return; playBtn.disabled=true;sfx('card');await animateCardFlight(c);battle.playerStage=c;renderBattle();await wait(90);battle.hand.splice(battle.hand.findIndex(x=>x.uid===c.uid),1);

function applyEndStatus(){ const e=battle.statuses.enemy,p=battle.statuses.player; if(e.bleed>0){ damageEnemy(e.bleed); e.bleed=Math.max(0,e.bleed-1) } if(p.bleed>0){ damagePlayer(p.bleed); p.bleed=Math.max(0,p.bleed-1) } }
function poker(arr){ let rs=arr.map(x=>x.card.rank).sort((a,b)=>a-b), ss=arr.map(x=>x.card.suit), cnt={}; rs.forEach(r=>cnt[r]=(cnt[r]||0)+1); let v=Object.values(cnt).sort((a,b)=>b-a), u=[...new Set(rs)], fl=new Set(ss).size===1, st=(u.length===5&&u[4]-u[0]===4)||JSON.stringify(u)===JSON.stringify([2,3,4,5,14]); if(st&&fl)return{name:'스트레이트 플러시',p:70}; if(v[0]===4)return{name:'포카드',p:52}; if(v[0]===3&&v[1]===2)return{name:'풀하우스',p:40}; if(fl)return{name:'플러시',p:32}; if(st)return{name:'스트레이트',p:28}; if(v[0]===3)return{name:'트리플',p:22}; if(v[0]===2&&v[1]===2)return{name:'투페어',p:16}; if(v[0]===2)return{name:'페어',p:10}; return{name:'하이카드',p:5} }
async function showdown(){ sfx('reward'); battle.phase='showdown'; battle.slots.forEach(s=>runCardEffects('before_showdown',s.card)); const advantage=BattleCore.resolveShowdownAdvantage({battle,playerSlots:battle.slots,enemySlots:battle.enemySlots}); battle.slots.forEach((s,i)=>runCardEffects('on_showdown_advantage',s.card,{slotIndex:i,advantage})); const p=poker(battle.slots), e=poker(battle.enemySlots); let pp=p.p+advantage.player+battle.slotBonus, ep=e.p+advantage.enemy; const score={value:pp}; battle.slots.forEach((s,i)=>runCardEffects('on_showdown_score',s.card,{slotIndex:i,score})); pp=score.value; flash(`${p.name}<br>${pp} : ${ep}`); await wait(700); const diff=Math.abs(pp-ep); if(pp>ep){ damageEnemy(diff); flash(`적 -${diff}`) } else if(ep>pp){ damagePlayer(diff); flash(`플레이어 -${diff}`) } else flash('동점'); battle.slots.forEach(s=>runCardEffects('after_showdown_result',s.card,{playerWon:pp>ep})); await wait(450); battle.slots.forEach(s=>runCardEffects('on_set_end',s.card)); battle.slots.forEach(s=>battle.discard.push(s.card)); battle.enemySlots=[]; battle.slots=[]; battle.effects=battle.effects.filter(effect=>effect.duration!=='set'); battle.trick=1; battle.setIndex++; battle.phase='trick'; battle.chip=battle.maxChip; battle.history=CardEffects.newHistory(); battle.playerStage=null; battle.selected=null; battle.inspectSlot=null; battle.mods={paint:false,plus:0,reverse:false,double:false}; battle.trump=pick(SUITS).k; nextEnemy(); renderBattle(); if(battle.enemy.hp<=0) await winBattle(); if(run.hp<=0) loseRun() }

function takeReward(cardId,mode,id){const def=cardDefinition(cardId),s=def.suit,r=def.rank;if(mode==='engrave'){let i=run.deck.findIndex(c=>c.suit===s&&c.rank===r&&!c.named);if(i<0)i=run.deck.findIndex(c=>c.suit===s&&c.rank===r);if(i>=0)run.deck[i]=makeNamed(cardId);else run.deck.push(makeNamed(cardId))}else run.deck.push(makeNamed(cardId));closeOverlay();completeNode(run.map.find(n=>n.id===id))}
function skipReward(id){ run.gold+=12; closeOverlay(); completeNode(run.map.find(n=>n.id===id)) }
function showEvent(node){ showModal(`<h2>이벤트 · 끊어진 관측소</h2><p>낡은 모니터가 미래를 조금 읽어 준다.</p><div class="choiceList"><button class="choice" onclick="eventPick('${node.id}','gold')"><b>부품 분해</b><span>골드 +30</span></button><button class="choice" onclick="eventPick('${node.id}','card')"><b>관측 데이터 보관</b><span>관측자 ♣5 추가</span></button><button class="choice" onclick="eventPick('${node.id}','heal')"><b>숨 고르기</b><span>체력 +10</span></button></div>`) }
function eventPick(id,type){ if(type==='gold')run.gold+=30; if(type==='card')run.deck.push(makeCard('C',5,'C5')); if(type==='heal')run.hp=Math.min(run.maxHp,run.hp+10); completeNode(run.map.find(n=>n.id===id)) }
function showCamp(node){ showModal(`<h2>캠프</h2><div class="choiceList"><button class="choice" onclick="campPick('${node.id}','heal')"><b>휴식</b><span>체력 30% 회복</span></button><button class="choice" onclick="campPick('${node.id}','remove')"><b>정리</b><span>순수 카드 1장 제거 (최소 36장)</span></button><button class="choice" onclick="campPick('${node.id}','gold')"><b>탐색</b><span>골드 +24</span></button></div>`) }
function campPick(id,type){ if(type==='heal')run.hp=Math.min(run.maxHp,run.hp+Math.ceil(run.maxHp*.3)); if(type==='remove'&&run.deck.length>36){ let i=run.deck.findIndex(c=>!c.named); if(i>=0)run.deck.splice(i,1) } if(type==='gold')run.gold+=24; completeNode(run.map.find(n=>n.id===id)) }
function showShop(node){ showModal(`<h2>상점</h2><p>골드 ${run.gold}</p><div class="choiceList"><button class="choice" onclick="shopPick('${node.id}','remove',45)"><b>카드 제거 · 45G</b><span>순수 카드 1장 제거</span></button><button class="choice" onclick="shopPick('${node.id}','scout',35)"><b>정찰 구매 · 35G</b><span>전술 카드 정찰 추가</span></button><button class="choice" onclick="shopPick('${node.id}','heal',28)"><b>응급 수리 · 28G</b><span>체력 +14</span></button><button class="choice" onclick="completeNode(run.map.find(n=>n.id==='${node.id}'))"><b>나가기</b></button></div>`) }
function shopPick(id,type,cost){ if(run.gold<cost){ sfx('lose'); return } run.gold-=cost; if(type==='remove'&&run.deck.length>36){ let i=run.deck.findIndex(c=>!c.named); if(i>=0)run.deck.splice(i,1) } if(type==='scout'){ let t=TACTICS.find(t=>t.id==='scout'); run.tactics.push({...t,uid:Math.random().toString(36).slice(2)}) } if(type==='heal')run.hp=Math.min(run.maxHp,run.hp+14); showShop(run.map.find(n=>n.id===id)) }
function finishRun(){ showModal(`<h2 class="cyan">ACT 1 클리어</h2><p>이번 리워크 프로토타입의 끝이다.<br>덱 ${run.deck.length}장 / 네임드 ${run.deck.filter(c=>c.named).length}장 / 전술 ${run.tactics.length}장</p><div class="choiceList"><button class="choice" onclick="location.reload()"><b>새 런</b></button></div>`) }
function showModal(html){ modal.innerHTML=html; overlay.classList.add('show') } function closeOverlay(){ overlay.classList.remove('show') }
function showTerm(t){ showModal(`<h2>${t}</h2><p>${TERMS[t]||'설명 준비 중.'}</p><div class="choiceList"><button class="choice" onclick="closeOverlay()"><b>닫기</b></button></div>`) }
function showTerms(){ showModal(`<h2>용어 사전</h2><div class="choiceList">${Object.entries(TERMS).map(([k,v])=>`<button class="choice"><b>${k}</b><span>${v}</span></button>`).join('')}<button class="choice" onclick="closeOverlay()"><b>닫기</b></button></div>`) }
function floatText(host,txt,cls=''){ const d=document.createElement('div'); d.className='float '+cls; d.textContent=txt; d.style.left='50%'; d.style.top='56%'; host.appendChild(d); setTimeout(()=>d.remove(),750) }
function flash(txt){ const d=document.createElement('div'); d.className='flash'; d.innerHTML=txt; arena.appendChild(d); setTimeout(()=>d.remove(),820) }
function burstAt(x,y,color='#fff3a0',count=8){
  for(let i=0;i<count;i++){
    const p=document.createElement('div');
    p.className='particle';
    p.style.left=x+'px'; p.style.top=y+'px';
    p.style.background=i%2?color:'#ffffff';
    p.style.setProperty('--dx', ((Math.random()*90)-45)+'px');
    p.style.setProperty('--dy', ((Math.random()*70)-35)+'px');
    arena.appendChild(p);
    setTimeout(()=>p.remove(),560);
  }
}
function centerOf(id){ const host=arena.getBoundingClientRect(); const el=document.getElementById(id).getBoundingClientRect(); return {x:el.left-host.left+el.width/2,y:el.top-host.top+el.height/2}; }
function slashFx(){ const d=document.createElement('div'); d.className='slash'; arena.appendChild(d); setTimeout(()=>d.remove(),260) }
function wait(ms){ return new Promise(r=>setTimeout(r,ms)) }
renderStart();
</script>
</body>
</html>
